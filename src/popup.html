<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>重点消息</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  html, body{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    background:#0d1b2a;
    overflow:hidden;
    padding:0;
    height:100%;
    width:100%;
  }
  .popup-container{
    display:flex;
    flex-direction:column;
    height:100%;
    width:100%;
    overflow:hidden;
  }
  .popup-body{
    flex:1 1 0%;
    overflow-y:auto;
    background:#0d1b2a;
    padding:6px 8px;
  }
  .btn{
    padding:6px 12px;
    border:none;
    border-radius:4px;
    cursor:pointer;
    font-size:12px;
    font-weight:500;
    transition:all 0.2s;
    white-space:nowrap;
  }
  .copy-btn{background:#1b3a5f;color:#90caf9;}
  .copy-btn:hover{background:#234b73;}
  .copy-btn.copied{background:#2e7d32;color:#fff;}
  .context-btn{background:#1565c0;color:#fff;}
  .context-btn:hover{background:#1976d2;}
  .countdown-bar{
    height:2px;
    background:linear-gradient(90deg,#00bcd4,#26c6da);
    transform-origin:left;
    animation:countdown 10s linear forwards;
  }
  @keyframes countdown{
    from{transform:scaleX(1);}
    to{transform:scaleX(0);}
  }
  .msg-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:4px 0;
    border-bottom:1px solid #1b3a5f;
    margin-bottom:4px;
  }
  .msg-source-wrap{
    display:flex;
    align-items:center;
    gap:4px;
    flex:1;
    min-width:0;
    overflow:hidden;
  }
  .msg-source{
    font-weight:600;
    color:#e3f2fd;
    font-size:13px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    min-width:0;
    flex-shrink:1;
  }
  .msg-source .group-icon{
    color:#4fc3f7;
    margin-right:2px;
  }
  .match-reason{
    font-size:11px;
    color:#ffb74d;
    margin-left:4px;
    white-space:nowrap;
  }
  .msg-time{
    color:#78909c;
    font-size:11px;
    white-space:nowrap;
    margin-left:4px;
    flex-shrink:0;
  }
  .msg-body{
    padding:4px 0;
  }
  .msg-content{
    color:#e0e0e0;
    line-height:1.6;
    white-space:pre-wrap;
    word-break:break-all;
    font-size:13px;
  }
  .msg-link{
    color:#4fc3f7;
    text-decoration:underline;
    cursor:pointer;
  }
  .msg-image{
    max-width:100%;
    max-height:200px;
    border-radius:4px;
    margin-top:4px;
    display:block;
    cursor:zoom-in;
  }
  .msg-footer{
    padding:4px 0;
    border-top:1px solid #1b3a5f;
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:4px;
    gap:6px;
  }
  .btn-group{display:flex;gap:6px;flex-shrink:0;white-space:nowrap;}
  .msg-meta{
    color:#78909c;
    font-size:11px;
    display:flex;
    align-items:center;
    min-width:0;
    overflow:hidden;
  }
  .msg-meta span{
    margin-right:6px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    min-width:0;
  }
  .dup-groups{
    display:none;
    padding:4px 0;
    font-size:11px;
    color:#90a4ae;
  }
  .dup-groups.show{
    display:block;
  }
  .dup-groups-list{
    padding:4px 6px;
    background:#1b3a5f;
    border-radius:3px;
    margin-top:4px;
    display:flex;
    flex-wrap:wrap;
    gap:2px;
  }
  .dup-groups-list span{
    background:#234b73;
    color:#b3e5fc;
    padding:1px 4px;
    border-radius:2px;
  }
  .loading{text-align:center;padding:16px;color:#78909c;font-size:13px;}
</style>
</head>
<body>
<div class="popup-container" id="popupContainer">
  <div class="popup-body" id="popupBody">
    <div class="loading">加载中...</div>
  </div>
  <div class="countdown-bar" id="countdownBar"></div>
</div>

<script type="module">
const { invoke } = window.__TAURI__.core;
const { listen } = window.__TAURI__.event;
const { getCurrentWindow } = window.__TAURI__.window;
const { open } = window.__TAURI__.shell;

let popupData = null;
let autoCloseTimer = null;
let autoCloseStartTime = 0;
const AUTO_CLOSE_TIMEOUT = 10000;
const CQ_IMAGE_REG = /\[CQ:image,[^\]]+\]/g;

const imageCache = new Map();
const MAX_CACHE_SIZE = 50;

async function loadImageToDataUrl(url) {
  if (imageCache.has(url)) {
    const value = imageCache.get(url);
    imageCache.delete(url);
    imageCache.set(url, value);
    return value;
  }
  try {
    const dataUrl = await invoke('fetch_image', { url });
    if (imageCache.size >= MAX_CACHE_SIZE) {
      const firstKey = imageCache.keys().next().value;
      imageCache.delete(firstKey);
    }
    imageCache.set(url, dataUrl);
    return dataUrl;
  } catch(e) {
    console.warn('图片加载失败:', url, e);
    return null;
  }
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

function escapeAttr(text) {
  return String(text).replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function makeLinksClickable(text) {
  const urlPattern = /((https?:\/\/|www\.)[^\s<>"]+)/gi;
  return text.replace(urlPattern, (url) => {
    let href = url.startsWith('www.') ? 'https://' + url : url;
    try {
      const parsed = new URL(href);
      if (!['http:', 'https:'].includes(parsed.protocol)) return escapeAttr(url);
    } catch(e) {
      return escapeAttr(url);
    }
    return `<a href="${href}" data-external-link="${href}" class="msg-link">${escapeAttr(url)}</a>`;
  });
}

window.openLink = async function(url) {
  try {
    await open(url);
  } catch(e) {
    console.error('打开链接失败:', e);
  }
};

function formatTime(timestamp) {
  if (!timestamp) return '';
  const d = new Date(timestamp * 1000);
  return d.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
}

function cleanContent(content) {
  content = String(content);
  content = content.replace(CQ_IMAGE_REG, '');
  content = content.replace(/\[CQ:reply,[^\]]+\]/g, '');
  content = content.replace(/\[CQ:at,qq=\d+,name=([^\]]+)\]/g, '@$1');
  content = content.replace(/\[CQ:[^\]]+\]/g, '');
  content = content.replace(/&#91;/g, '[');
  content = content.replace(/&#93;/g, ']');
  content = content.replace(/&amp;/g, '&');
  content = content.trim();
  return content;
}

function cleanContentForCopy(content) {
  content = String(content);
  content = content.replace(CQ_IMAGE_REG, '');
  content = content.replace(/\[CQ:reply,[^\]]+\]/g, '');
  content = content.replace(/\[CQ:at,qq=\d+,name=([^\]]+)\]/g, '@$1');
  content = content.replace(/\[CQ:[^\]]+\]/g, '');
  content = content.replace(/&#91;/g, '[');
  content = content.replace(/&#93;/g, ']');
  content = content.replace(/&amp;/g, '&');
  content = content.trim();
  let lines = content.split(/\r?\n/);
  let result = [];
  let lastLineIsEmpty = false;
  for (let i = 0; i < lines.length; i++) {
    let line = lines[i];
    let isEmpty = line.trim() === '';
    if (!isEmpty) {
      result.push(line);
      lastLineIsEmpty = false;
    } else {
      if (!lastLineIsEmpty) {
        result.push('');
        lastLineIsEmpty = true;
      }
    }
  }
  content = result.join('\n');
  return content;
}

function startAutoClose() {
  if (autoCloseTimer) clearInterval(autoCloseTimer);
  autoCloseStartTime = Date.now();
  let isClosing = false;
  
  autoCloseTimer = setInterval(() => {
    if (isClosing) return;
    
    const elapsed = Date.now() - autoCloseStartTime;
    if (elapsed >= AUTO_CLOSE_TIMEOUT) {
      isClosing = true;
      clearInterval(autoCloseTimer);
      autoCloseTimer = null;
      console.log('[弹窗] 开始关闭流程...');
      
      closePopup().then(() => {
        console.log('[弹窗] 关闭完成');
      }).catch(err => {
        console.error('[弹窗] 关闭失败:', err);
        window.close();
      });
    }
  }, 500);
}

function resetAutoClose() {
  autoCloseStartTime = Date.now();
  const bar = document.getElementById('countdownBar');
  if (bar) {
    bar.style.animation = 'none';
    bar.offsetHeight;
    bar.style.animation = 'countdown 10s linear forwards';
  }
}

async function renderPopup(data) {
  console.log('[弹窗] renderPopup 被调用');
  popupData = data;

  const body = document.getElementById('popupBody');
  
  if (!data) {
    console.error('[弹窗] data 为空，无法渲染');
    return;
  }
  console.log('[弹窗] 开始渲染内容，图片数量:', (data.images || []).length);
  const source = data.group_name || data.source || '未知来源';
  const time = formatTime(data.msg_time || data.time || Date.now() / 1000);
  const rawContent = data.raw_message || data.content || '';
  const content = cleanContent(rawContent);
  const images = data.images || [];
  const matchReason = data.match_reason || (data.reasons && data.reasons.length > 0 ? `[${data.reasons.join(', ')}]` : '');
  const nickname = data.sender?.nickname || '';

  const contentHtml = makeLinksClickable(escapeHtml(content));
  
  let imagesHtml = '';
  const hasTextContent = content.trim().length > 0;
  if (images.length > 0 && hasTextContent) {
    imagesHtml = images.map(img => 
      `<img class="msg-image" data-src="${escapeAttr(img)}" alt="图片" referrerpolicy="no-referrer" crossorigin="anonymous">`
    ).join('');
  }

  let dupHtml = '';
  if (data.content_dup_info && data.content_dup_info.count > 1) {
    dupHtml = `
      <div class="dup-groups show">
        <div class="dup-groups-list">${data.content_dup_info.groups.map(g => `<span>🏠 ${escapeHtml(g)}</span>`).join('')}</div>
      </div>
    `;
  }

  body.innerHTML = `
    <div class="msg-header">
      <div class="msg-source-wrap">
        <div class="msg-source"><span class="group-icon">🏠</span>${escapeHtml(source)}</div>
        ${matchReason ? `<span class="match-reason">${escapeHtml(matchReason)}</span>` : ''}
      </div>
      <div class="msg-time">${time}</div>
    </div>
    ${dupHtml}
    <div class="msg-body">
      <div class="msg-content">${contentHtml}</div>
      ${imagesHtml}
    </div>
    <div class="msg-footer">
      <div class="msg-meta">${nickname ? `<span>👤 ${escapeHtml(nickname)}</span>` : ''}</div>
      <div class="btn-group">
        <button class="btn copy-btn" id="cardCopyBtn">复制</button>
        <button class="btn context-btn" id="cardContextBtn">上下文</button>
      </div>
    </div>
  `;

  const imgElements = body.querySelectorAll('.msg-image[data-src]');
  const imageLoadPromises = [];
  
  for (const img of imgElements) {
    const originalUrl = img.dataset.src;
    const loadPromise = loadImageToDataUrl(originalUrl).then(async (dataUrl) => {
      if (dataUrl) {
        img.src = dataUrl;
      } else {
        img.src = originalUrl;
      }
      img.removeAttribute('data-src');
      
      // 等待图片加载完成
      await new Promise((resolve) => {
        if (img.complete && img.naturalWidth > 0) {
          resolve();
        } else {
          img.onload = resolve;
          img.onerror = resolve;
        }
      });
      
      // 等待图片解码
      if (img.decode) {
        try {
          await img.decode();
        } catch(e) {}
      }
      
      // 等待图片实际渲染到DOM
      await new Promise(resolve => requestAnimationFrame(resolve));
      await new Promise(resolve => requestAnimationFrame(resolve));
      
      // 额外等待确保布局完成
      await new Promise(resolve => setTimeout(resolve, 50));
    });
    imageLoadPromises.push(loadPromise);
  }

  await Promise.all(imageLoadPromises);
  
  // 所有图片加载完成后，再等待一下确保DOM完全更新
  await new Promise(resolve => requestAnimationFrame(resolve));
  await new Promise(resolve => requestAnimationFrame(resolve));
  await new Promise(resolve => setTimeout(resolve, 200));

  document.getElementById('cardCopyBtn').addEventListener('click', handleCopy);
  document.getElementById('cardContextBtn').addEventListener('click', handleContext);

  await window.resizeForContent();
  startAutoClose();
}

window.resizeForContent = async function() {
  console.log('[弹窗] resizeForContent 开始');
  try {
    const body = document.getElementById('popupBody');
    const container = document.getElementById('popupContainer');
    
    // 等待所有图片加载完成
    const images = body.querySelectorAll('.msg-image');
    const imagePromises = Array.from(images).map(img => {
      if (img.complete && img.naturalWidth > 0) {
        return Promise.resolve();
      }
      return new Promise(resolve => {
        img.onload = resolve;
        img.onerror = resolve;
        // 设置超时，避免无限等待
        setTimeout(resolve, 3000);
      });
    });
    
    if (imagePromises.length > 0) {
      await Promise.all(imagePromises);
      // 图片加载后再等待一下让布局稳定
      await new Promise(resolve => setTimeout(resolve, 100));
    }
    
    console.log(`[弹窗调试] 图片加载完成: ${images.length}张`);
    
    // 临时切换到block布局获取真实高度
    const prevDisplay = container.style.display;
    container.style.display = 'block';
    body.style.height = 'auto';
    body.style.overflow = 'visible';
    
    await new Promise(resolve => requestAnimationFrame(resolve));
    await new Promise(resolve => setTimeout(resolve, 50));
    
    const contentHeight = body.scrollHeight;
    console.log(`[弹窗调试] 内容高度: ${contentHeight}`);
    
    // 恢复原始布局
    container.style.display = prevDisplay;
    body.style.overflow = '';
    
    // body.scrollHeight 已包含 CSS padding，无需重复计算
    const countdownBarHeight = 4;
    const extraHeight = 50;
    const windowChrome = 30;
    const totalHeight = contentHeight + countdownBarHeight + extraHeight + windowChrome;
    const fixedHeight = Math.min(Math.max(totalHeight, 150), 500);
    
    console.log(`[弹窗调试] 总高度: ${totalHeight}, 窗口高度: ${fixedHeight}`);
    
    const win = getCurrentWindow();
    // 使用 Logical 类型，与 Rust 端 inner_size 保持一致
    await win.setSize({ type: 'Logical', width: 280, height: fixedHeight });
    console.log('[弹窗] resizeForContent 完成');
    
    // 显示窗口
    await win.show();
    
    // 立即保存位置
    saveWindowState();
  } catch(e) {
    console.error('调整窗口大小失败:', e);
  }
};

async function handleCopy() {
  if (!popupData) return;
  
  const btn = document.getElementById('cardCopyBtn');
  btn.textContent = '复制中...';
  btn.disabled = true;

  try {
    const images = popupData.images || [];
    const content = cleanContentForCopy(popupData.raw_message || popupData.content || '');
    const imageUrl = images.length > 0 ? images[0] : null;

    await invoke('copy_to_clipboard', {
      text: content,
      imageUrl: imageUrl
    });

    btn.textContent = '✓';
    btn.classList.add('copied');

    setTimeout(() => {
      btn.textContent = '复制';
      btn.classList.remove('copied');
      btn.disabled = false;
    }, 2000);
  } catch(e) {
    console.error('复制失败:', e);
    btn.textContent = '失败';
    btn.disabled = false;
    setTimeout(() => {
      btn.textContent = '复制';
    }, 1500);
  }
}

async function closePopup() {
  console.log('[弹窗] closePopup 被调用');
  
  const popupId = window.location.hash.substring(1);
  console.log('[弹窗] popupId:', popupId);
  
  if (!popupId) {
    console.error('[弹窗] 没有 popupId，直接关闭');
    window.close();
    return;
  }
  
  try {
    console.log('[弹窗] 调用 Rust close_popup:', popupId);
    await invoke('close_popup', { popupId: popupId });
    console.log('[弹窗] close_popup 调用完成');
  } catch(e) {
    console.error('[弹窗] close_popup 失败:', e);
    console.log('[弹窗] 尝试前端关闭...');
    try {
      await getCurrentWindow().destroy();
    } catch(e2) {
      window.close();
    }
  }
}

async function handleContext() {
  if (!popupData) return;

  const btn = document.getElementById('cardContextBtn');
  btn.disabled = true;
  btn.textContent = '跳转...';

  try {
    const groupId = popupData.group_id || '';
    const groupName = popupData.group_name || popupData.source || '';
    const localId = popupData.local_id || 0;

    await invoke('request_show_context', {
      groupId: groupId,
      groupName: groupName,
      localId: localId
    });

    btn.textContent = '✓';
    
    setTimeout(closePopup, 200);
  } catch(e) {
    console.error('查看上下文失败:', e);
    btn.textContent = '失败';
    btn.disabled = false;
    setTimeout(() => {
      btn.textContent = '上下文';
    }, 1500);
  }
}

document.addEventListener('click', (e) => {
  const link = e.target.closest('a[data-external-link]');
  if (link) {
    e.preventDefault();
    e.stopPropagation();
    const url = link.dataset.externalLink;
    if (url) {
      window.openLink(url);
    }
    return;
  }
  
  if(e.target.classList.contains('msg-image')){
    const img = e.target;
    const imgSrc = img.dataset.src || img.src;
    if (imgSrc) {
      invoke('open_image_viewer', { 
        imageUrl: imgSrc, 
        width: img.naturalWidth || null, 
        height: img.naturalHeight || null 
      }).catch(e => console.error('打开图片窗口失败:', e));
    }
  }
});

document.addEventListener('click', resetAutoClose);

document.addEventListener('error', (e) => {
  if (e.target.tagName === 'IMG' && e.target.classList.contains('msg-image')) {
    e.target.style.border = '2px red solid';
    e.target.title = '加载失败';
  }
}, true);

const myPopupId = window.location.hash.substring(1);
console.log('[弹窗] 我的ID:', myPopupId);
console.log('[弹窗] 完整URL:', window.location.href);

let dataReceived = false;

async function tryGetData() {
  if (dataReceived) return;
  
  try {
    const data = await invoke('get_popup_data', { popupId: myPopupId });
    if (data) {
      console.log('[弹窗] 主动获取到数据:', data);
      dataReceived = true;
      renderPopup(data);
    }
  } catch(e) {
    console.error('[弹窗] 获取数据失败:', e);
  }
}

(async () => {
  await listen('popup-initialized', (event) => {
    console.log('[弹窗] 收到初始化事件:', event.payload);
    const payload = event.payload;
    if (payload && payload.popup_id === myPopupId && payload.data) {
      console.log('[弹窗] 收到自己的数据');
      dataReceived = true;
      renderPopup(payload.data);
    }
  });
  console.log('[弹窗] 监听器已注册，等待数据...');
  
  // 主动尝试获取数据（备用方案）
  setTimeout(tryGetData, 500);
  setTimeout(tryGetData, 1500);
})();

async function saveWindowState() {
  try {
    const win = getCurrentWindow();
    const position = await win.outerPosition();
    const scale = await win.scaleFactor();
    
    if (position.x < -10000 || position.y < -10000) return;
    
    const logicalX = Math.round(position.x / scale);
    const logicalY = Math.round(position.y / scale);
    
    console.log('[弹窗] 物理位置: x=', position.x, ', y=', position.y, ' 缩放:', scale, ' 逻辑位置: x=', logicalX, ', y=', logicalY);
    
    await invoke('save_popup_state', {
      x: logicalX,
      y: logicalY
    });
    console.log('[弹窗] 保存成功');
  } catch(e) {
    console.error('[弹窗] 保存失败:', e);
  }
}

let saveStateTimer = null;
function debouncedSaveWindowState() {
  if (saveStateTimer) clearTimeout(saveStateTimer);
  saveStateTimer = setTimeout(saveWindowState, 200);
}

(async () => {
  try {
    const win = getCurrentWindow();
    console.log('[弹窗] 注册窗口移动事件...');
    
    await win.onMoved((event) => {
      debouncedSaveWindowState();
    });
    
    console.log('[弹窗] 事件注册成功');
  } catch(e) {
    console.error('[弹窗] 注册事件失败:', e);
  }
})();
</script>
</body>
</html>
